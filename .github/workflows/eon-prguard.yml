name: EON PR Guard

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: PR Guard Security Review
        run: |
          BLOCKED=0
          WARNINGS=""

          # Check SQL injection
          if grep -rqE '(SELECT|INSERT|UPDATE|DELETE)\s.*".*\+' backend/ 2>/dev/null; then
            BLOCKED=1
            WARNINGS="$WARNINGS\n- SQL injection: string concatenation"
          fi

          # Check f-string SQL injection
          if grep -rqE 'f".*(SELECT|INSERT|UPDATE|DELETE)' backend/ 2>/dev/null; then
            BLOCKED=1
            WARNINGS="$WARNINGS\n- SQL injection: f-string query"
          fi

          # Check hardcoded secrets
          if grep -rqE '(api_key|secret|password)\s*=\s*"[A-Za-z0-9_-]{8,}"' backend/ 2>/dev/null; then
            BLOCKED=1
            WARNINGS="$WARNINGS\n- Hardcoded secret detected"
          fi

          # Check XSS
          if grep -rq 'dangerouslySetInnerHTML' frontend/ 2>/dev/null; then
            WARNINGS="$WARNINGS\n- XSS risk: dangerouslySetInnerHTML"
          fi

          # Build review comment
          {
            echo "## EON PR Guard Review"
            echo ""
            if [ "$BLOCKED" = "1" ]; then
              echo "### \`\`\`diff"
              echo "- RESULT: BLOCKED"
              echo "\`\`\`"
              echo ""
              echo "**Issues found:**"
              echo -e "$WARNINGS"
              echo ""
              echo "> \`\`\`diff"
              echo "> - MERGE: NOT ALLOWED"
              echo "> \`\`\`"
            else
              if [ -n "$WARNINGS" ]; then
                echo "### \`\`\`diff"
                echo "! RESULT: WARN"
                echo "\`\`\`"
                echo ""
                echo "**Warnings:**"
                echo -e "$WARNINGS"
              else
                echo "### \`\`\`diff"
                echo "+ RESULT: PASS"
                echo "\`\`\`"
                echo ""
                echo "No security issues detected."
              fi
            fi
            echo ""
            echo "| Critic | Verdict |"
            echo "|--------|---------|"
            echo "| E (Invariant) | :white_check_mark: |"
            if [ "$BLOCKED" = "1" ]; then
              echo "| N (Computability) | :x: Security violation |"
              echo "| O (Risk) | :x: Blocked |"
            else
              echo "| N (Computability) | :white_check_mark: |"
              echo "| O (Risk) | :white_check_mark: |"
            fi
            echo ""
            echo "---"
            echo "*EON PR Guard v4.4 · $(date -u)*"
          } >> $GITHUB_STEP_SUMMARY

          if [ "$BLOCKED" = "1" ]; then
            echo "::error::PR Guard BLOCKED — security issues found"
            exit 1
          fi
